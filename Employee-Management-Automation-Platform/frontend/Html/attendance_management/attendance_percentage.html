
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Percentage</title>
    <link rel="stylesheet" href="../../Css/attendance.css">
</head>

<body>

    <div class="container">

        <h1>Attendance Percentage</h1>

        <form id="attendancePercentageForm">

            <label for="employee_id">Employee ID</label>
            <input
                type="number"
                id="employee_id"
                name="employee_id"
                min="1"
                required
            >

            <button type="submit">Get Attendance Percentage</button>

        </form>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Attendance Percentage</th>
                    </tr>
                </thead>

                <tbody id="percentageTableBody">
                    <tr>
                        <td colspan="2">Enter an Employee ID to continue.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p id="message"></p>

        <button
            type="button"
            onclick="window.location.href='attendance.html'"
        >
            Back
        </button>

    </div>

    <script src="../../Js/attendance_management/attendance_percentage.js"></script>

</body>
</html>
