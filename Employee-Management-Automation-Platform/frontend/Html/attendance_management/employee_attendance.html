
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Attendance</title>

    <link rel="stylesheet" href="../../Css/attendance.css">
</head>

<body>

    <div class="container">

        <h1>Employee Attendance</h1>

        <form id="employeeAttendanceForm">

            <label for="employee_id">Employee ID</label>
            <input
                type="number"
                id="employee_id"
                name="employee_id"
                min="1"
                required
            >

            <label for="month">Month</label>
            <select id="month" name="month" required>
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10" selected>October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>

            <label for="year">Year</label>
            <select id="year" name="year" required>
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
            </select>

            <button type="submit">Search Attendance</button>

        </form>

        <div class="table-container">

            <table>
                <thead>
                    <tr>
                        <th>Attendance ID</th>
                        <th>Employee ID</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="attendanceTableBody">
                    <tr>
                        <td colspan="5">
                            Enter Employee ID and select month and year.
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>

        <p id="message"></p>

        <button
            type="button"
            onclick="window.location.href='attendance.html'">
            Back
        </button>

    </div>

    <script src="../../Js/attendance_management/employee_attendance.js"></script>

</body>
</html>
