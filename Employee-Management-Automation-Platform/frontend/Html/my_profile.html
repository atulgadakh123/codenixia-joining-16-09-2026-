
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
        }

        /* Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f2937;
            color: white;
            padding: 16px 30px;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .back-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #1d4ed8;
        }

        /* Profile Container */
        .profile-container {
            max-width: 650px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-icon {
            width: 80px;
            height: 80px;
            line-height: 80px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            font-size: 30px;
        }

        .profile-header h3 {
            color: #111827;
            margin-bottom: 5px;
        }

        .profile-header p {
            color: #6b7280;
        }

        .profile-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .detail {
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .detail label {
            display: block;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .detail p {
            color: #111827;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .profile-details {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 14px 16px;
            }

            .navbar h2 {
                font-size: 19px;
            }

            .profile-container {
                margin: 20px 12px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <h2>My Profile</h2>

        <button class="back-btn" onclick="history.back()">
            ← Back
        </button>
    </nav>

    <!-- Profile Container -->
    <div class="profile-container">

        <div class="profile-header">
            <div class="profile-icon" id="profile_icon">U</div>
            <h3 id="name"></h3>
            <!-- <p id="designation"></p> -->
        </div>

        <div class="profile-details">

            <div class="detail">
                <label>Employee ID</label>
                <p id="employee_id">Loading...</p>
            </div>

            <div class="detail">
                <label>Full Name</label>
                <p id="name">Loading...</p>
            </div>

            <div class="detail">
                <label>Email</label>
                <p id="email">Loading...</p>
            </div>

            <div class="detail">
                <label>Phone</label>
                <p id="phone">Loading...</p>
            </div>

            <div class="detail">
                <label>Department</label>
                <p id="department">Loading...</p>
            </div>

            <div class="detail">
                <label>Designation</label>
                <p id="designation"></p>
            </div>

            <div class="detail">
                <label>Joining Date</label>
                <p id="joining_date">Loading...</p>
            </div>

            <div class="detail">
                <label>Salary</label>
                <p id="salary">Loading...</p>
            </div>

        </div>
    </div>

    <script src="../Js/my_profile.js"></script>

</body>
</html>
