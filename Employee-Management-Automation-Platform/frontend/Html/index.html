
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Employee Management System</title>

    <link rel="stylesheet" href="../Css/index.css">
</head>

<body>

    <!-- Header / Navigation -->
    <header class="navbar">
        <div class="brand">
            <span class="brand-icon">👥</span>
            <h1>Employee Management System</h1>
        </div>

        <nav>
            
            <a href="../Html/index.html" class="active" id="homeLink">Home</a>
            <a href="../Html/login.html" id="navLogin">Login</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="home-container">

        <!-- Project Image -->
        <section class="project-section">
            <img
                src="../images/image.png"
                alt="AI Powered Employee Management System"
                class="project-image"
            >
        </section>

        <!-- Registration Panel -->
        <section class="register-section">

            <div id="registerPanel">

                <h2>Create Your Account</h2>

                <p class="register-description">
                    Register to access the Employee Management System
                </p>

                <form id="registerForm">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="regEmail">Email</label>
                        <input
                            type="email"
                            id="regEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input
                            type="password"
                            id="regPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="role">Role</label>
                        <select id="role" name="role" required>
                            <option value="">Select Role</option>
                            <option value="admin">Admin</option>
                            <option value="employee">Employee</option>
                        </select>
                    </div>

                    <button type="submit" class="register-btn">
                        👤 Register
                    </button>

                </form>

                <p id="registerMessage"></p>
                <p class="login-link">
    Already registered?
    <a href="login.html">Login here</a>
</p>

            </div>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="../Js/registration.js"></script>

</body>
</html>
