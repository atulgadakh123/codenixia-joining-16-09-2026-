
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee AI Agent</title>
    <link rel="stylesheet" href="../../Css/rag.css">
</head>
<body>

    <div class="container">
        <h1>Employee AI Agent</h1>
        <p>Ask questions about employee details, salary, and attendance.</p>

        <form id="agentForm">
            <label for="employee_id">Employee ID (Optional)</label>
            <input
                type="number"
                id="employee_id"
                name="employee_id"
                placeholder="Enter employee ID"
                min="1"
                style="width: 100%; padding: 12px; margin-bottom: 20px;"
            >

            <label for="question">Your Question</label>
            <textarea
                id="question"
                name="question"
                placeholder="Example: What is this employee's salary?"
                required
            ></textarea>

            <button type="submit">Ask Agent</button>
        </form>

        <div id="loading" style="display: none;">
            Processing your question...
        </div>

        <div id="answerSection" style="display: none;">
            <h2>Agent Response</h2>
            <div id="answer"></div>
        </div>

        <p id="errorMessage"></p>

        <button type="button" onclick="history.back()">Back</button>
    </div>

    <script src="../../Js/AI/employee_agent.js"></script>
</body>
</html>
