
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Employee</title>

    <!-- Same CSS as Add Employee -->
    <link rel="stylesheet" href="../../Css/add_employee.css">
</head>

<body>

    <div class="registration-container">

        <h1>Employee Management System</h1>
        <h2>Delete Employee</h2>

        <form id="deleteEmployeeForm">

            <div class="form-group">
                <label for="employee_id">Employee ID</label>
                <input
                    type="number"
                    id="employee_id"
                    name="employee_id"
                    placeholder="Enter employee ID"
                    min="1"
                    required
                >
            </div>

            <button type="submit">Delete Employee</button>

            <p id="message"></p>

        </form>

        <p class="login-link">
            <a href="employee.html">Back to Employee Management</a>
        </p>

        <p class="login-link">
            <a href="../../Html/dashboard.html">Back to Dashboard</a>
        </p>

    </div>

    <script src="../../Js/employee_manegment/delete_employee.js"></script>

</body>
</html>
