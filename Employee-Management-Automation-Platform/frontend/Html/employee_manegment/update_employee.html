
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Employee</title>

    <link rel="stylesheet" href="../../Css/add_employee.css">
</head>

<body>

    <div class="registration-container">

        <h1>Employee Management System</h1>
        <h2>Update Employee</h2>

        <form id="searchEmployeeForm">

            <div class="form-group">
                <label for="employee_id">Employee ID</label>
                <input
                    type="number"
                    id="employee_id"
                    name="employee_id"
                    placeholder="Enter employee ID"
                    min="1"
                    required
                >
            </div>

            <button type="submit">Get Employee</button>

        </form>

        <hr style="margin: 25px 0;">

        <form id="updateEmployeeForm" hidden>

            <div class="form-group">
                <label for="name">Employee Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" required>
            </div>

            <div class="form-group">
                <label for="designation">Designation</label>
                <input type="text" id="designation" name="designation" required>
            </div>

            <div class="form-group">
                <label for="joining_date">Joining Date</label>
                <input type="date" id="joining_date" name="joining_date" required>
            </div>

            <div class="form-group">
                <label for="salary">Monthly Salary</label>
                <input
                    type="number"
                    id="salary"
                    name="salary"
                    min="0"
                    step="0.01"
                    required
                >
            </div>

            <button type="submit">Update Employee</button>

        </form>

        <p id="message"></p>

        <p class="login-link">
            <a href="employee.html">Back to Employee Management</a>
        </p>

        <p class="login-link">
            <a href="../../Html/dashboard.html">Back to Dashboard</a>
        </p>

    </div>

    <script src="../../Js/employee_manegment/update_employee.js"></script>

</body>

</html>
