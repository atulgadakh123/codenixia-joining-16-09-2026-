
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Employee Management System</title>

    <link rel="stylesheet" href="../Css/index.css">
</head>

<body>

    <!-- Header / Navigation -->
    <header class="navbar">
        <div class="brand">
            <span class="brand-icon">👥</span>
            <h1>Employee Management System</h1>
        </div>

        <nav>
            <a href="../Html/index.html" class="active" id="homeLink">Home</a>
            <a href="../Html/index.html" id="navRegister">Register</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="home-container">

        <!-- Project Image -->
        <section class="project-section">
            <img
                src="../images/image.png"
                alt="AI Powered Employee Management System"
                class="project-image"
            >
        </section>

        <!-- Login Section -->
        <section class="register-section">

            <div id="loginPanel">

                <h2>Welcome Back</h2>

                <p class="register-description">
                    Login to access your Employee Management System
                </p>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="register-btn">
                        🔐 Login
                    </button>

                </form>

                <p id="loginMessage"></p>
                <p class="login-link">
    Don't have an account?
    <a href="index.html">Register here</a>
</p>


            </div>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="../Js/login.js"></script>

</body>
</html>
